# Supabase 反向代理
#
# 为什么需要它
#   这个应用是「浏览器直连数据库」的架构：前端在 Cloudflare 上（能访问），
#   但登录令牌、愿望数据、图片、实时推送全部由手机**直接**请求
#   xxxx.supabase.co，这条连接不经过 Cloudflare。
#   在部分网络环境下 *.supabase.co 会被阻断，表现就是网页能打开、
#   但一直停在「本地演示数据」，挂了 VPN 就立刻正常。
#   这个 Worker 让手机只跟自己的域名说话，由 Cloudflare 去访问 Supabase。
#
# 部署
#   Cloudflare Workers Builds 连接本仓库后，push 即自动部署。
#   部署完记得在 Worker 的 Settings → Domains & Routes 里加上 sb.yuetaijie.top。
name = "duo-wish-board-app-sb"
main = "cloudflare/supabase-proxy.js"
compatibility_date = "2026-08-26"

# 这里**不需要**任何 KV / R2 / D1 绑定。
#
# 旧版「Worker + KV」架构的 [[kv_namespaces]] 已移除：
# 它用的是占位 id "local-dev"，会让 wrangler deploy 直接失败
# （KV namespace 'local-dev' is not valid，code 10042）。
# 对应后端 workers/space-api.ts 也已停用 —— 前端只有在设置
# VITE_CLOUDFLARE_API_BASE 时才会走 Cloudflare 后端，
# 而 .env.production 里没有这个变量。
