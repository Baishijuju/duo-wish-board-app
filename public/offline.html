<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#efe2cf" />
    <title>愿望清单暂时离线</title>
    <style>
      :root {
        color: #241b16;
        background: #fff6eb;
        font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        place-items: center;
        padding: 1rem;
        background:
          radial-gradient(circle at 20% 0%, rgba(201, 111, 74, 0.18), transparent 32%),
          linear-gradient(180deg, #fff6eb, #efe2cf);
      }

      main {
        display: grid;
        gap: 0.8rem;
        width: min(100%, 25rem);
        padding: 1.35rem;
        border: 1px solid rgba(95, 74, 55, 0.14);
        border-radius: 24px;
        background: rgba(255, 250, 244, 0.86);
        box-shadow: 0 18px 42px rgba(78, 55, 39, 0.08);
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 1.45rem;
        line-height: 1.25;
      }

      p {
        color: rgba(68, 51, 40, 0.76);
        line-height: 1.7;
      }

      button {
        min-height: 2.75rem;
        border: 0;
        border-radius: 999px;
        background: #c96f4a;
        color: #fffaf4;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>现在暂时离线</h1>
      <p>已经打开过的页面会尽量留在本机。等网络回来后，再刷新一次继续同步愿望、奖励和照片。</p>
      <button type="button" onclick="window.location.reload()">重新试试</button>
    </main>
  </body>
</html>
